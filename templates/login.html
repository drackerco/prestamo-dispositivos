<!DOCTYPE html>
<html>
<head>
<title>Préstamo Dispositivos</title>
<style>
body { font-family: Arial; display: flex; justify-content: center; margin-top: 100px; background: #f3f4f6; }
.box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 320px; background: white; }
input, select, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
button { background: #3b82f6; color: white; border: none; cursor: pointer; border-radius: 5px; }
#codigo { display: none; }
</style>
</head>
<body>
<div class="box">
<h3>Préstamo Dispositivos</h3>
<form method="POST">
<input type="email" name="correo" placeholder="Correo" required>
<select name="rol" id="rol" onchange="mostrarCodigo()" required>
<option value="Estudiante">Estudiante</option>
<option value="Administrador">Administrador</option>
</select>
<input type="text" name="codigo" id="codigo" placeholder="Código admin">
<button type="submit">Entrar</button>
</form>
</div>
<script>
function mostrarCodigo() {
  var rol = document.getElementById("rol").value;
  document.getElementById("codigo").style.display = rol === "Administrador" ? "block" : "none";
}
</script>
</body>
</html>
